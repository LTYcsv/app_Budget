stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - docker compose build
  only:
    - main

# Tests run inside the freshly built backend image (in-memory SQLite, no DB needed).
# A failing test run stops the pipeline before deploy.
test:
  stage: test
  script:
    - docker compose run --rm --no-deps backend pytest
  only:
    - main

deploy:
  stage: deploy
  script:
    - docker compose up -d --remove-orphans
    - docker image prune -f
  only:
    - main
  when: on_success
  environment:
    name: production
    url: https://чек.site
