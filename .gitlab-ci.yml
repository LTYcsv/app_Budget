stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - ubuntu
  script:
    - docker compose build
  only:
    - main

deploy:
  stage: deploy
  tags:
    - ubuntu
  script:
    - docker compose up -d --remove-orphans
    - docker image prune -f
  only:
    - main
  when: on_success
  environment:
    name: production
    url: https://чек.site
