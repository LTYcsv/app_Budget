<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0520"/>
      <stop offset="60%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox" id="glow">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Glow blob behind charts -->
  <ellipse cx="960" cy="180" rx="220" ry="120" fill="#7c3aed" opacity="0.08" filter="url(#blur)"/>

  <!-- Chart bars (right side decoration) -->
  <rect x="760" y="188" width="24" height="72" fill="url(#bar2)" rx="4"/>
  <rect x="796" y="158" width="24" height="102" fill="url(#bar2)" rx="4"/>
  <rect x="832" y="172" width="24" height="88" fill="url(#bar2)" rx="4"/>
  <rect x="868" y="136" width="24" height="124" fill="url(#bar1)" rx="4"/>
  <rect x="904" y="148" width="24" height="112" fill="url(#bar1)" rx="4"/>
  <rect x="940" y="112" width="24" height="148" fill="url(#bar1)" rx="4"/>
  <rect x="976" y="96" width="24" height="164" fill="url(#bar1)" rx="4"/>
  <rect x="1012" y="76" width="24" height="184" fill="url(#bar1)" rx="4"/>
  <rect x="1048" y="108" width="24" height="152" fill="url(#bar2)" rx="4"/>
  <rect x="1084" y="60" width="24" height="200" fill="url(#bar1)" rx="4"/>
  <rect x="1120" y="44" width="24" height="216" fill="url(#bar1)" rx="4"/>
  <rect x="1156" y="80" width="24" height="180" fill="url(#bar2)" rx="4"/>

  <!-- Trend line over bars -->
  <path d="M 772 230 C 820 210 870 185 920 160 S 1000 120 1060 95 S 1130 68 1168 60"
        fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
  <!-- Glow on trend line -->
  <path d="M 772 230 C 820 210 870 185 920 160 S 1000 120 1060 95 S 1130 68 1168 60"
        fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.12" stroke-linecap="round"/>

  <!-- Decorative circle -->
  <circle cx="710" cy="140" r="90" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <circle cx="710" cy="140" r="60" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.08"/>

  <!-- Left content -->
  <!-- App name -->
  <text x="72" y="138"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="96" font-weight="800" fill="url(#title-grad)"
        letter-spacing="-3">Чек</text>

  <!-- Horizontal rule -->
  <line x1="74" y1="158" x2="560" y2="158" stroke="url(#title-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="75" y="188"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="21" fill="#94a3b8" letter-spacing="0.3">Персональный финансовый трекер</text>

  <!-- Tech line -->
  <text x="75" y="222"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14" fill="#475569" letter-spacing="0.5">React 19  ·  FastAPI  ·  PostgreSQL 16  ·  Docker  ·  135 тестов</text>
</svg>
