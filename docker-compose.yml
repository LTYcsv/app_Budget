services:
  db:
    image: postgres:16
    container_name: finflow-postgres
    environment:
      POSTGRES_DB: finflow
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    # No host port binding — DB is only reachable inside the Docker network
    volumes:
      - finflow_pg_data:/var/lib/postgresql/data
    networks:
      - finflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d finflow']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # One-shot: applies Alembic migrations and exits. Backend waits for
  # successful completion, so migrations never race app startup or replicas.
  migrate:
    build:
      context: ./backend
    container_name: finflow-migrate
    command: ['alembic', 'upgrade', 'head']
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/finflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finflow
    restart: 'no'

  backend:
    build:
      context: ./backend
    container_name: finflow-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/finflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - finflow
    # No host port binding — backend is only reachable via nginx
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  frontend:
    build:
      context: ./app
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: finflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finflow
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  finflow_pg_data:

networks:
  finflow:
    driver: bridge
